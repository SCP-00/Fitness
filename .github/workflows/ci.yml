name: CI

# This workflow lives at the repository root on purpose: GitHub only reads
# `.github/workflows/` from the root of a repository, so the copy that used to sit
# in `fitness-ecosystem/.github/` was never executed. Every `run` step therefore
# starts inside the monorepo, which is where the lockfile and the workspace live.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # Step-level `working-directory:` overrides are resolved from the repository
    # root, so those steps spell out `fitness-ecosystem/...` explicitly.
    working-directory: fitness-ecosystem

jobs:
  check:
    name: lint + typecheck + unit + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # The lockfile is inside the monorepo, not at the repository root.
          cache-dependency-path: fitness-ecosystem/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fitness-ecosystem/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        working-directory: fitness-ecosystem/bodylab/apps/web
        run: npx playwright install --with-deps chromium

      # The full quality pyramid in one command (see docs/TESTING.md):
      #   typechecks → root vitest → web vitest → browser E2E.
      # E2E tests that need a GPU skip themselves gracefully on CI runners.
      - name: Run the full check pyramid
        run: pnpm check

      # Production build proves the lazy-route chunks + WASM assets bundle cleanly
      # and that the prod-only CSP injects into index.html. A whole page (the
      # measurement history) once shipped blank in this build while every test
      # passed, so building is part of the gate, not just packaging.
      - name: Production build (BodyLab)
        working-directory: fitness-ecosystem/bodylab/apps/web
        run: npx vite build

      - name: Production build (TrainingLab)
        run: pnpm --filter traininglab-desktop build

  desktop:
    name: BodyLab desktop shell compiles (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fitness-ecosystem/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fitness-ecosystem/bodylab/apps/desktop/src-tauri

      # Compiling the Tauri shell on Windows proves the desktop target stays
      # healthy (Cargo.toml, capabilities, icons) without shipping an installer
      # from CI. Release artifacts are cut by release.yml / locally.
      - name: Compile desktop shell (no bundle)
        working-directory: fitness-ecosystem/bodylab/apps/desktop
        run: pnpm tauri build --no-bundle

  traininglab-desktop:
    name: TrainingLab desktop shell compiles (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fitness-ecosystem/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + web build
        run: pnpm --filter traininglab-desktop build

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fitness-ecosystem/traininglab/apps/desktop/src-tauri

      - name: Compile desktop shell (no bundle)
        working-directory: fitness-ecosystem/traininglab/apps/desktop
        run: pnpm tauri build --no-bundle

  e2e-desktop-smoke:
    name: BodyLab desktop binary smoke (Windows)
    runs-on: windows-latest
    needs: desktop
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fitness-ecosystem/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fitness-ecosystem/bodylab/apps/desktop/src-tauri

      # Release build + the binary-level smoke test (launch, window, storage
      # container, graceful exit): this is the job that would have caught the
      # stale-beta.2 finding, because it embeds the CURRENT frontend.
      - name: Build release binary
        working-directory: fitness-ecosystem/bodylab/apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Smoke test the binary
        shell: pwsh
        working-directory: fitness-ecosystem
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File
          "bodylab/apps/desktop/scripts/smoke-desktop.ps1"
