# Workspace members are exactly what the repository ships. `corpus/` used to be
# listed here, but it is deliberately excluded from the repository (see the root
# .gitignore): keeping it as a member made the lockfile record an importer whose
# directory does not exist in a fresh clone, so every `pnpm install
# --frozen-lockfile` — including CI — died with ERR_PNPM_OUTDATED_LOCKFILE. Its
# research assets can still be installed on their own by running `pnpm install`
# inside `corpus/`.
# `traininglab/core/*` and `traininglab/packages/*` used to be listed here for
# seven empty `@fitness/traininglab-*` packages (plus an eighth empty
# `traininglab/apps/web`). They contained a `package.json` and nothing else, so
# they were removed 2026-09-30 along with their globs (plan optimizacion, Fase 1).
packages:
  - "bodylab/apps/*"
  - "bodylab/packages/*"
  - "bodylab/core/*"
  - "traininglab/apps/*"
allowBuilds:
  esbuild: true
  # tesseract.js (used by scripts/import-symmetry.mjs for the OCR of the
  # Symmetry screenshots) has a `postinstall` that only runs the OpenCollective
  # donation banner. pnpm 11 fails a whole install with ERR_PNPM_IGNORED_BUILDS
  # when a dependency ships a build script that nothing declared — which is what
  # turned every CI job red at "Install dependencies" on 2026-10-05. Declaring
  # `false` says "we read it and we don't want it", which is the honest answer
  # for a donation banner, and keeps the lockfile check strict for everything else.
  tesseract.js: false
