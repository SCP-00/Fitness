<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BodyLab - Anthropometric Tracker & Body Composition Analysis" />
    <meta name="theme-color" content="#f6f7fb" />
    <!-- Fonts are self-hosted (public/fonts, OFL) — BodyLab stays offline-first even for typography. -->
    <title>BodyLab</title>
  </head>
  <body>
    <script>
      (function() {
        var stored = localStorage.getItem('bodylab-theme');
        var theme = stored || 'light';
        var resolved = theme === 'system'
          ? window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          : theme;
        document.documentElement.classList.add(resolved);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
