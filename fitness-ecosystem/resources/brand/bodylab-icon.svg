<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="BodyLab">
  <title>BodyLab</title>
  <defs>
    <linearGradient id="bl-indigo" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bl-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <!-- Clinical surface -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bl-surface)"/>
  <rect x="26" y="26" width="972" height="972" rx="210" fill="none" stroke="#e0e7ff" stroke-width="10"/>

  <!-- Measurement backdrop -->
  <g stroke="#c7d2fe" stroke-width="8" stroke-linecap="round" opacity="0.6">
    <line x1="196" y1="700" x2="828" y2="700"/>
    <line x1="196" y1="806" x2="828" y2="806"/>
  </g>

  <!-- V-taper torso: wide shoulders, narrow waist (unmistakable at 64 px) -->
  <path
    d="M486 236 h52 l172 92 v76 h-36 l18 148 -16 202 h-232 l-16 -202 18 -148 h-36 v-76 z"
    fill="url(#bl-indigo)"
    stroke="url(#bl-indigo)"
    stroke-width="34"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Shoulder line + waist marks inside the silhouette -->
  <g stroke="#c7d2fe" stroke-width="14" stroke-linecap="round" opacity="0.75">
    <line x1="452" y1="392" x2="572" y2="392"/>
    <line x1="470" y1="508" x2="554" y2="508"/>
    <line x1="462" y1="656" x2="562" y2="656"/>
  </g>

  <!-- Caliper across the chest: the analysis mark -->
  <g stroke="#4f46e5" stroke-width="18" stroke-linecap="round">
    <line x1="176" y1="452" x2="848" y2="452"/>
    <line x1="176" y1="400" x2="176" y2="504"/>
    <line x1="848" y1="400" x2="848" y2="504"/>
  </g>
  <circle cx="848" cy="452" r="30" fill="#4f46e5"/>
  <circle cx="848" cy="452" r="12" fill="#eef2ff"/>
</svg>
