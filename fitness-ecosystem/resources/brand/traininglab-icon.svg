<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TrainingLab">
  <title>TrainingLab</title>
  <defs>
    <linearGradient id="tl-ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="tl-heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Steel surface -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="#0a0a0a"/>
  <rect x="24" y="24" width="976" height="976" rx="212" fill="none" stroke="#1f1f1f" stroke-width="8"/>

  <!-- Heated-metal halo -->
  <circle cx="512" cy="512" r="330" fill="url(#tl-heat)"/>

  <g transform="rotate(-24 512 512)">
    <!-- Bar -->
    <rect x="286" y="474" width="452" height="76" rx="38" fill="url(#tl-ember)"/>
    <!-- Inner plates -->
    <rect x="330" y="392" width="92" height="240" rx="40" fill="url(#tl-ember)"/>
    <rect x="602" y="392" width="92" height="240" rx="40" fill="url(#tl-ember)"/>
    <!-- Outer plates -->
    <rect x="222" y="424" width="84" height="176" rx="36" fill="url(#tl-ember)"/>
    <rect x="718" y="424" width="84" height="176" rx="36" fill="url(#tl-ember)"/>
    <!-- Ember highlight -->
    <g opacity="0.5" fill="#fdba74">
      <rect x="352" y="412" width="20" height="200" rx="10"/>
      <rect x="624" y="412" width="20" height="200" rx="10"/>
      <rect x="306" y="494" width="380" height="14" rx="7"/>
    </g>
  </g>
</svg>
