[package]
name = "traininglab"
version = "0.2.0"
description = "TrainingLab desktop host (Tauri v2) — the gym-logging half of the fitness ecosystem"
authors = ["TrainingLab"]
edition = "2021"
# Tauri 2.12 requires 1.90 (checked against the crate's own rust-version).
rust-version = "1.90"

[lib]
name = "traininglab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# Opening external links (the BodyLab LAN URL, the docs) in the system browser.
tauri-plugin-opener = "2.7"
# Native OS notifications — the one thing the web Notification API cannot do
# inside a WebView. This is what makes the rest-timer alert a real Windows toast.
tauri-plugin-notification = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
